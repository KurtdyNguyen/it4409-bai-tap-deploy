<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý người dùng</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      function SearchForm({ onChangeValue }) {
        return (
          <input
            className="form-bar"
            type="text"
            placeholder="Tìm theo name, username"
            onChange={(e) => onChangeValue(e.target.value)}
          />
        );
      }

      function AddUser({ onAdd }) {
        const [adding, setAdding] = React.useState(false);
        const [user, setUser] = React.useState({
          name: "",
          username: "",
          email: "",
          address: { street: "", suite: "", city: "" },
          phone: "",
          website: "",
        });
        const handleChange = (e) => {
          const { id, value } = e.target;
          if (["street", "suite", "city"].includes(id)) {
            setUser({ ...user, address: { ...user.address, [id]: value } });
          } else {
            setUser({ ...user, [id]: value });
          }
        };
        const handleAdd = () => {
          if (user.name === "" || user.username === "") {
            alert("Vui lòng nhập Name và Username!");
            return;
          }
          onAdd(user);
          setUser({
            name: "",
            username: "",
            email: "",
            address: { street: "", suite: "", city: "" },
            phone: "",
            website: "",
          });
          setAdding(false);
        };
        return (
          <div>
            <button className="addButton" onClick={() => setAdding(true)}>
              Thêm
            </button>
            {adding && (
              <div>
                <div>
                  <h4>Thêm người dùng</h4>
                  <label htmlFor="name"> Name: </label>
                  <input
                    className="form-bar"
                    id="name"
                    type="text"
                    value={user.name}
                    onChange={handleChange}
                  />
                  <label htmlFor="username"> UserName: </label>
                  <input
                    className="form-bar"
                    id="username"
                    type="text"
                    value={user.username}
                    onChange={handleChange}
                  />
                  <button className="addButton" onClick={handleAdd}>
                    Thêm
                  </button>
                  <button
                    className="cancelButton"
                    onClick={() => setAdding(false)}
                  >
                    Hủy
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      function ResultTable({ keyword, user, onAdded }) {
        const [users, setUsers] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [editing, setEditing] = React.useState(null);

        React.useEffect(() => {
          fetch("https://jsonplaceholder.typicode.com/users")
            .then((res) => res.json())
            .then((data) => {
              setUsers(data);
              setLoading(false);
            });
        }, []);

        React.useEffect(() => {
          if (user) {
            setUsers((prev) => [...prev, { ...user, id: prev.length + 1 }]);
            onAdded();
          }
        }, [user]);

        const filteredUsers = users.filter(
          (u) =>
            u.name.toLowerCase().includes(keyword.toLowerCase()) ||
            u.username.toLowerCase().includes(keyword.toLowerCase()),
        );

        function editUser(user) {
          setEditing({ ...user, address: { ...user.address } });
        }
        function saveUser() {
          setUsers((prev) =>
            prev.map((u) => (u.id === editing.id ? editing : u)),
          );
          setEditing(null);
        }

        return (
          <div>
            <table>
              <tbody>
                {filteredUsers.map((u) => (
                  <tr key={u.id}>
                    <td>{u.id}</td>
                    <td>{u.name}</td>
                    <td>{u.username}</td>
                    <td>{u.email}</td>
                    <td>
                      {u.address.street}, {u.address.suite}, {u.address.city}
                    </td>
                    <td>{u.phone}</td>
                    <td>
                      <button className="addButton" onClick={() => editUser(u)}>
                        Sửa
                      </button>
                      <button
                        className="cancelButton"
                        onClick={() => removeUser(u.id)}
                      >
                        Xóa
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            {editing && (
              <div>
                <label htmlFor="name"> Name: </label>
                <input
                  className="form-bar"
                  id="name"
                  type="text"
                  value={editing.name}
                  onChange={(e) => handleEditChange("name", e.target.value)}
                />
                <label htmlFor="username"> UserName: </label>
                <input
                  className="form-bar"
                  id="username"
                  type="text"
                  value={editing.username}
                  onChange={(e) => handleEditChange("username", e.target.value)}
                />
              </div>
            )}
          </div>
        );
      }

      function App() {
        const [kw, setKeyword] = React.useState("");
        const [newUser, setNewUser] = React.useState(null);
        return (
          <div>
            <h1>Quản lý người dùng</h1>
            <SearchForm onChangeValue={setKeyword} />
            <AddUser onAdd={setNewUser} />
            <ResultTable
              keyword={kw}
              user={newUser}
              onAdded={() => setNewUser(null)}
            />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
